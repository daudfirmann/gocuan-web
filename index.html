    <title>GoCuan</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00C0E8',
                        secondary: '#B2CE37',

                        surface: '#FFFFFF',

                    fontFamily: {

                    }
                }
            }
        }
    </script>

    <style>

        }

        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #9ca3af;
        }
    </style>
</head>

                        <img src="img/play_store.png" alt="Get it on Google Play" class="w-full h-auto object-contain">
                    </a>
                    
                    <a href="#" class="flex-1 hover:opacity-90 transition-opacity">

                    </a>
                </div>
            </div>

            <!-- Dynamic Content Injected Here -->
            <div id="content-area" class="max-w-4xl mx-auto">

            </div>
        </main>

            const data = pageData[pageKey];
            if (!data) return;

            let sectionsHTML = data.sections.map(sec => `
                <div class="mt-6 md:mt-8">
                    <h3 class="text-base md:text-lg font-bold text-gray-900 mb-2">${sec.title}</h3>
                    <p class="text-gray-600 leading-relaxed text-sm text-justify">${sec.content}</p>
                </div>
            `).join('');

            contentArea.innerHTML = `
                <div class="border-b-[3px] border-secondary inline-block pr-6 pb-2 mb-4 md:mb-6">
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">${data.title}</h1>

                </p>

                ${sectionsHTML}
                
                <div class="h-10"></div>
            `;

        }

                    menuItems.forEach(m => {
                        m.classList.remove('active', 'bg-activeMenu', 'text-primary');
                        m.classList.add('text-gray-700', 'hover:bg-gray-50');
                    });

                    }
                } else {
